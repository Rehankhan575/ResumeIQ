[server]
enableStaticServing = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false

[logger]
level = "warning"

[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FA"
primaryColor = "#4F46E5"
textColor = "#111827"

[client]
toolbarMode = "minimal"
showErrorDetails = false
