[server]
# Allow Streamlit to serve files from app/ui/static/ so fonts load offline
enableStaticServing = true

[browser]
gatherUsageStats = false

[runner]
# Avoids hash mismatches when modules are reloaded
magicEnabled = false

[logger]
level = "warning"

[theme]
# Dark developer-tools palette matching CSS tokens
base = "dark"
backgroundColor      = "#0A0E14"
secondaryBackgroundColor = "#111720"
primaryColor         = "#5EEAD4"
textColor            = "#E8EDF3"

[client]
toolbarMode = "minimal"
showErrorDetails = false

