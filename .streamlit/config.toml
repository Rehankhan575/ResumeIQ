[server]
enableStaticServing = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false

[logger]
level = "warning"

[theme]
base = "dark"
backgroundColor = "#07080B"
secondaryBackgroundColor = "#0F1117"
primaryColor = "#2DD4BF"
textColor = "#F8FAFC"

[client]
toolbarMode = "minimal"
showErrorDetails = false
